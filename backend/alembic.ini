# Alembic 配置文件

[alembic]
# Alembic 脚本位置
script_location = app/alembic

# 模板文件位置
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 是否在迁移文件名中使用 UTC 时间
timezone = UTC

# 最大修订版本长度
truncate_slug_length = 40

# 设置 'sqlalchemy.url' 驱动程序的路径
# 留空以使用默认值
# driver = 

# 数据库连接池设置
[post_write_hooks]

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S












